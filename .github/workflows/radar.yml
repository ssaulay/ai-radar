name: radar
run-name: "radar · ${{ github.event_name == 'schedule' && 'cron GitHub' || inputs.source || 'manuel' }}"

on:
  schedule:
    # toutes les 30 minutes, décalé des heures pleines où GitHub Actions accumule du retard.
    # Réenregistré le 22/09/2026 : aucune exécution planifiée n'avait démarré après la création du dépôt.
    # Constat des 22-23/09/2026 : GitHub ne l'exécute qu'environ toutes les 3 h. Le Worker Cloudflare
    # (infra/cloudflare-trigger) appelle workflow_dispatch aux mêmes minutes ; ce cron reste en secours.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forcer toutes les sources (ignorer les cadences)'
        required: false
        default: 'false'
      source:
        description: "Origine : 'manuel' (défaut, jamais sauté) ou 'cloudflare-cron' (soumis au garde-fou de 20 min)"
        required: false
        default: 'manuel'

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  garde:
    # Un passage planifié (cron GitHub ou Worker Cloudflare) est sauté si le dernier passage ayant sauvegardé l'état
    # a démarré il y a moins de 20 min : les deux planificateurs se doublent sans coût. Les passages sautés ne
    # sauvegardent rien, donc ne remettent pas le compteur à zéro. Les déclenchements manuels (source 'manuel'
    # ou force=true) ne sont jamais sautés. En cas d'erreur du garde-fou, le passage a lieu.
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.garde.outputs.skip }}
    steps:
      - id: garde
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          SOURCE: ${{ inputs.source }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && { [ -z "$SOURCE" ] || [ "$SOURCE" = "manuel" ] || [ "$FORCE" = "true" ]; }; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "déclenchement manuel : pas de garde-fou"; exit 0
          fi
          # l'heure de début est dans la description de la release 'state' ; repli sur l'ancienne branche state (migration)
          msg=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/state" --jq '.body' 2>/dev/null || true)
          if [ -z "$msg" ]; then msg=$(gh api "repos/$GITHUB_REPOSITORY/commits/state" --jq '.commit.message' 2>/dev/null || true); fi
          started=$(printf '%s' "$msg" | sed -n 's/.*started \([0-9TZ:-]*\).*/\1/p' | head -1)
          if [ -z "$started" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; echo "aucun état sauvegardé : on exécute"; exit 0; fi
          age=$(( ( $(date -u +%s) - $(date -u -d "$started" +%s) ) / 60 ))
          if [ "$age" -lt 20 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::passage sauté : le dernier passage ($EVENT/${SOURCE:-cron}) a démarré il y a $age min (< 20), état déjà à jour"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "dernier passage démarré il y a $age min : on exécute"
          fi

  run:
    needs: garde
    if: needs.garde.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Heure de début (écrite dans le commit d'état, lue par le garde-fou)
        run: echo "RUN_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restaurer l'état (release 'state', repli sur l'ancienne branche state)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p state
          if gh release download state -p radar.sqlite.gz -O /tmp/radar.sqlite.gz 2>/dev/null; then
            gunzip -c /tmp/radar.sqlite.gz > state/radar.sqlite && echo "état restauré depuis la release state ($(du -h state/radar.sqlite | cut -f1))"
          elif git fetch --depth 1 origin state 2>/dev/null && git cat-file -e origin/state:radar.sqlite.gz 2>/dev/null; then
            git show origin/state:radar.sqlite.gz | gunzip -c > state/radar.sqlite && echo "état restauré depuis l'ancienne branche state (migration, $(du -h state/radar.sqlite | cut -f1))"
          else
            echo "aucun état précédent : première exécution"
          fi

      - name: Tests
        run: node --test tests/*.test.mjs

      - name: Collecte, regroupement, score, rendu
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then node radar.mjs run --force; else node radar.mjs run; fi

      - name: Sauvegarder l'état (asset de la release 'state', limite 2 Go par fichier)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -rf /tmp/state && mkdir -p /tmp/state && gzip -6 -c state/radar.sqlite > /tmp/state/radar.sqlite.gz
          echo "état : $(du -h state/radar.sqlite | cut -f1) brut, $(du -h /tmp/state/radar.sqlite.gz | cut -f1) compressé"
          gh release view state >/dev/null 2>&1 || gh release create state --title "état du radar" --notes "état initial" --prerelease
          gh release upload state /tmp/state/radar.sqlite.gz --clobber
          # lu par le garde-fou ; écrit après l'envoi, donc un envoi raté ne remet pas le compteur à zéro
          gh release edit state --notes "started ${RUN_STARTED}"

      - name: Configurer Pages
        uses: actions/configure-pages@v5
      - name: Publier l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Déployer sur GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
